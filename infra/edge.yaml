AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CivicTax demo - the public entry point. CloudFront (HTTPS) serves the React build from a private S3 bucket and
  forwards /api/* to an Application Load Balancer in front of the ECS API service. Deploy after network.yaml and
  security.yaml, before auth.yaml and app.yaml.

Parameters:
  ProjectName:
    Type: String
    Default: civictax
    AllowedPattern: '^[a-z][a-z0-9-]{1,20}$'
  CloudFrontPrefixListId:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]+$'
    Description: >-
      Id of AWS's "CloudFront origin-facing" address list in this region. Find it with:
      aws ec2 describe-managed-prefix-lists --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing
      --query "PrefixLists[0].PrefixListId" --output text

Resources:
  # ---- Load balancer -----------------------------------------------------------------------------------------
  # Two locks so only OUR CloudFront distribution reaches the API:
  #   1. network: the security group admits CloudFront's addresses only;
  #   2. identity: the listener forwards only requests carrying a secret header that our distribution adds.
  OriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Shared secret CloudFront sends to the load balancer (X-Origin-Verify)
      KmsKeyId: !ImportValue { 'Fn::Sub': '${ProjectName}-DataKeyArn' }
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CivicTax load balancer - HTTP from CloudFront only
      VpcId: !ImportValue { 'Fn::Sub': '${ProjectName}-VpcId' }
      SecurityGroupIngress:
        - Description: HTTP from CloudFront edge locations
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId

  # The application tasks accept traffic from the load balancer and nothing else.
  AppIngressFromLoadBalancer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !ImportValue { 'Fn::Sub': '${ProjectName}-AppSecurityGroupId' }
      Description: API port from the load balancer only
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_91
            comment: "Demo: no access-log bucket. Requests are logged by the application in CloudWatch. Upgrade: ALB access logs to a log bucket"
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Split [',', !ImportValue { 'Fn::Sub': '${ProjectName}-PublicSubnetIds' }]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue { 'Fn::Sub': '${ProjectName}-VpcId' }
      TargetType: ip # Fargate tasks register by IP address
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' } # let in-flight requests finish on deploy

  # ponytail: plain HTTP between CloudFront and the load balancer. AWS can't issue a certificate without a domain
  # you own. With a domain: add an ACM certificate + HTTPS:443 listener here and set the origin to https-only.
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_2
            comment: "No certificate is possible without an owned domain. Only CloudFront can reach this listener (prefix list + secret header). Upgrade: ACM certificate + HTTPS listener"
          - id: CKV_AWS_103
            comment: "Same as CKV_AWS_2: HTTP listener by necessity until a domain exists"
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: { StatusCode: '403', ContentType: text/plain, MessageBody: Forbidden }

  ForwardVerifiedRequests:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values: [!Sub '{{resolve:secretsmanager:${OriginSecret}}}']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  # ---- Frontend bucket (private; only this distribution can read it) ----------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "Public static build output served via CloudFront; no access-log bucket in the demo"
          - id: CKV_AWS_21
            comment: "Reproducible build output; every release is rebuilt from git, so versions add cost without recovery value"
    DeletionPolicy: Delete # build output, reproducible from source (empty it before deleting the stack)
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub '${ProjectName}-frontend-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-frontend'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowThisDistributionOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt FrontendBucket.Arn, !Sub '${FrontendBucket.Arn}/*']
            Condition:
              Bool: { 'aws:SecureTransport': 'false' }

  # ---- CloudFront --------------------------------------------------------------------------------------------
  # Client-side routes (/resident, /officer/accounts ...) have no file in S3: serve the app shell for any path
  # without a file extension. Done per-behaviour here, so API 403/404 responses are never replaced by HTML.
  SpaRouting:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${ProjectName}-spa-routing'
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for client-side routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (!request.uri.split('/').pop().includes('.')) {
            request.uri = '/index.html';
          }
          return request;
        }

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-security-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:
            Override: true
            # Same policy as frontend/nginx.conf, plus the Cognito domain for the sign-in token exchange.
            ContentSecurityPolicy: !Sub >-
              default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src https://fonts.gstatic.com; img-src 'self' data:;
              connect-src 'self' https://${ProjectName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com;
              frame-ancestors 'none'

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_174
            comment: "The default cloudfront.net certificate fixes the minimum TLS version; it is configurable only with a custom domain certificate"
          - id: CKV_AWS_68
            comment: "Demo cost: no AWS WAF. Upgrade: managed rule groups on this distribution"
          - id: CKV_AWS_86
            comment: "Demo: no access-log bucket. Upgrade: CloudFront standard logging"
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} web'
        HttpVersion: http2and3
        PriceClass: PriceClass_100 # North America + Europe edge locations: the cheapest tier
        DefaultRootObject: index.html
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 30
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Sub '{{resolve:secretsmanager:${OriginSecret}}}'
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed: CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRouting.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # AWS managed: CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AWS managed: AllViewerExceptHostHeader (keeps Authorization)
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          # The frontend's "API status" indicator. Only this one path: it returns {"status":"UP"} and nothing else.
          # The rest of /actuator, Swagger UI and /v3/api-docs stay unrouted.
          - PathPattern: /actuator/health
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # AWS managed: CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AWS managed: AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeaders

Outputs:
  AppUrl:
    Description: Open this. Also the Cognito callback (append /login) for auth.yaml
    Value: !Sub 'https://${Distribution.DomainName}'
  DistributionId:
    Value: !Ref Distribution
  FrontendBucketName:
    Value: !Ref FrontendBucket
  ApiTargetGroupArn:
    Value: !Ref ApiTargetGroup
    Export: { Name: !Sub '${ProjectName}-ApiTargetGroupArn' }
