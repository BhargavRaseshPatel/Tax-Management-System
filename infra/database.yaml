AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CivicTax demo - Amazon Aurora PostgreSQL (Serverless v2, scales to zero when idle). Private subnets, encrypted at
  rest, TLS required, master password generated and stored by AWS in Secrets Manager. Deploy network.yaml first.

Parameters:
  ProjectName:
    Type: String
    Default: civictax
    AllowedPattern: '^[a-z][a-z0-9-]{1,20}$'
  DatabaseName:
    Type: String
    Default: property_tax
  MasterUsername:
    Type: String
    Default: civictax_admin
    Description: Not a secret. The password is generated by RDS and never appears in this template.
  EngineVersion:
    Type: String
    Default: '17.5'
    Description: >-
      Aurora PostgreSQL version (keep on major 17 to match local development). List what your region offers with:
      aws rds describe-db-engine-versions --engine aurora-postgresql --query 'DBEngineVersions[].EngineVersion'
  ParameterGroupFamily:
    Type: String
    Default: aurora-postgresql17
  MaxCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 16
    Description: Upper limit in Aurora Capacity Units (1 ACU is about 2 GiB of memory). Caps the hourly cost.
  DeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set true for anything you care about. False keeps demo clean-up to a single delete-stack.

Resources:
  SubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CivicTax isolated database subnets
      SubnetIds: !Split [',', !ImportValue { 'Fn::Sub': '${ProjectName}-DatabaseSubnetIds' }]

  ClusterParameterGroup:
    Type: AWS::RDS::DBClusterParameterGroup
    Properties:
      Description: CivicTax - reject any connection that is not TLS
      Family: !Ref ParameterGroupFamily
      Parameters:
        rds.force_ssl: '1'

  Cluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot # deleting the stack leaves a final snapshot behind
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      EngineVersion: !Ref EngineVersion
      DatabaseName: !Ref DatabaseName
      MasterUsername: !Ref MasterUsername
      ManageMasterUserPassword: true # RDS generates the password and keeps it in Secrets Manager
      DBSubnetGroupName: !Ref SubnetGroup
      VpcSecurityGroupIds:
        - !ImportValue { 'Fn::Sub': '${ProjectName}-DatabaseSecurityGroupId' }
      DBClusterParameterGroupName: !Ref ClusterParameterGroup
      StorageEncrypted: true # AWS-managed KMS key; Stage 16 switches to a customer-managed key
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      DeletionProtection: !Ref DeletionProtection
      EnableCloudwatchLogsExports: [postgresql]
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0 # pause when idle: you then pay for storage only
        MaxCapacity: !Ref MaxCapacity
        SecondsUntilAutoPause: 300

  Instance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref Cluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true

Outputs:
  ClusterEndpoint:
    Description: Writer endpoint (DB_HOST for the backend)
    Value: !GetAtt Cluster.Endpoint.Address
    Export: { Name: !Sub '${ProjectName}-DbEndpoint' }
  ClusterPort:
    Value: !GetAtt Cluster.Endpoint.Port
    Export: { Name: !Sub '${ProjectName}-DbPort' }
  DatabaseName:
    Value: !Ref DatabaseName
    Export: { Name: !Sub '${ProjectName}-DbName' }
  MasterSecretArn:
    Description: Secrets Manager secret holding {"username","password"}; ECS injects it, nobody copies it by hand
    Value: !GetAtt Cluster.MasterUserSecret.SecretArn
    Export: { Name: !Sub '${ProjectName}-DbSecretArn' }
