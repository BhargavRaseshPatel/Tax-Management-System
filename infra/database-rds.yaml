AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CivicTax demo - Amazon RDS for PostgreSQL, a single small instance. Use this INSTEAD of database.yaml on an AWS
  free-plan account, which refuses to create the Aurora cluster. Same exports, so app.yaml works with either; never
  deploy both. Not publicly accessible, encrypted at rest, master password generated and stored by AWS in Secrets
  Manager. Deploy network.yaml and security.yaml first.

Parameters:
  ProjectName:
    Type: String
    Default: civictax
    AllowedPattern: '^[a-z][a-z0-9-]{1,20}$'
  DatabaseName:
    Type: String
    Default: property_tax
  MasterUsername:
    Type: String
    Default: civictax_admin
    Description: Not a secret. The password is generated by RDS and never appears in this template.
  EngineVersion:
    Type: String
    Default: '17.11'
    Description: >-
      PostgreSQL version (keep on major 17 to match local development). List what your region offers with:
      aws rds describe-db-engine-versions --engine postgres --query 'DBEngineVersions[].EngineVersion'
  BackupRetentionDays:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 35
    Description: Days of automatic backups. AWS free-plan accounts reject anything above 1.
  DeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set true for anything you care about. False keeps demo clean-up to a single delete-stack.

Resources:
  SubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CivicTax database subnets (shared with the application)
      SubnetIds: !Split [',', !ImportValue { 'Fn::Sub': '${ProjectName}-PublicSubnetIds' }]

  Instance:
    Type: AWS::RDS::DBInstance
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_157
            comment: "Demo cost: single Availability Zone. Production: MultiAZ true, or the Aurora cluster in database.yaml"
          - id: CKV_AWS_118
            comment: "Demo cost: no enhanced monitoring. PostgreSQL logs are exported to CloudWatch"
          - id: CKV_AWS_161
            comment: "The application authenticates with a Secrets Manager secret that RDS rotates; IAM database authentication is not used"
    DeletionPolicy: Snapshot # deleting the stack leaves a final snapshot behind
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      StorageType: gp3
      DBName: !Ref DatabaseName
      MasterUsername: !Ref MasterUsername
      ManageMasterUserPassword: true # RDS generates the password, keeps it in Secrets Manager and rotates it
      MasterUserSecret:
        KmsKeyId: !ImportValue { 'Fn::Sub': '${ProjectName}-DataKeyArn' }
      DBSubnetGroupName: !Ref SubnetGroup
      VPCSecurityGroups:
        - !ImportValue { 'Fn::Sub': '${ProjectName}-DatabaseSecurityGroupId' }
      PubliclyAccessible: false
      MultiAZ: false
      StorageEncrypted: true
      KmsKeyId: !ImportValue { 'Fn::Sub': '${ProjectName}-DataKeyArn' } # customer-managed key (security.yaml); also covers backups and snapshots
      BackupRetentionPeriod: !Ref BackupRetentionDays
      CopyTagsToSnapshot: true
      DeletionProtection: !Ref DeletionProtection
      AutoMinorVersionUpgrade: true
      EnableCloudwatchLogsExports: [postgresql]

Outputs:
  Endpoint:
    Description: Instance endpoint (DB_HOST for the backend)
    Value: !GetAtt Instance.Endpoint.Address
    Export: { Name: !Sub '${ProjectName}-DbEndpoint' }
  Port:
    Value: !GetAtt Instance.Endpoint.Port
    Export: { Name: !Sub '${ProjectName}-DbPort' }
  DatabaseName:
    Value: !Ref DatabaseName
    Export: { Name: !Sub '${ProjectName}-DbName' }
  MasterSecretArn:
    Description: Secrets Manager secret holding {"username","password"}; ECS injects it, nobody copies it by hand
    Value: !GetAtt Instance.MasterUserSecret.SecretArn
    Export: { Name: !Sub '${ProjectName}-DbSecretArn' }
