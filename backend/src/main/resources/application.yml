spring:
  application:
    name: property-tax-backend
  # Local runs read the repo's .env (KEY=VALUE) directly; real environment variables still win.
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    # DB_URL_PARAMS is empty locally. For Aurora: ?sslmode=verify-full&sslrootcert=/app/rds-ca.pem
    # (encrypts the connection AND checks the server's certificate against Amazon's RDS certificate authority).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:property_tax}${DB_URL_PARAMS:}
    username: ${DB_USERNAME:property_tax}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100

app:
  # LOCAL ONLY: in-process token issuer standing in for Amazon Cognito (see DevTokenIssuer). Never true when deployed;
  # deployed environments set SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI to the Cognito user pool instead.
  dev-auth: ${DEV_AUTH:false}
  aws-region: ${AWS_REGION:ca-central-1}
  # Endpoints are empty in AWS (real services, credentials from the task role). Locally they point at emulators.
  documents:
    bucket: ${DOCUMENTS_BUCKET:civictax-documents}
    endpoint: ${S3_ENDPOINT:} # e.g. http://localhost:9090
  reports:
    table: ${REPORT_JOBS_TABLE:report_jobs}
    endpoint: ${DYNAMODB_ENDPOINT:} # e.g. http://localhost:8000

springdoc:
  swagger-ui:
    tags-sorter: alpha # tags are numbered "1. Users" ... "7. Payments" in workflow order

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
