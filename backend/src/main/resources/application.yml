spring:
  application:
    name: property-tax-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:property_tax}
    username: ${DB_USERNAME:property_tax}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100

springdoc:
  swagger-ui:
    tags-sorter: alpha # tags are numbered "1. Users" ... "7. Payments" in workflow order

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
