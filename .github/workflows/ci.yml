name: CI/CD

# Every push and pull request: build, test, lint, scan, and build both images.
# Pushes to main also deploy, but only when AWS is connected (repository variable AWS_DEPLOY_ROLE_ARN) and a
# reviewer approves the protected "production" environment. Setup: docs/deployment.md, Stage 17.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # least privilege by default; only the deploy job may request an AWS identity token

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # never cancel a run that may be deploying

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and integration tests (Testcontainers starts PostgreSQL and the AWS emulators in Docker)
        working-directory: backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  security:
    name: Infrastructure and secret scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Gitleaks reads every commit, not just the latest
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: pip install cfn-lint==1.57.2 checkov==3.3.29
      - name: CloudFormation lint
        run: cfn-lint -r us-east-2 -t infra/*.yaml
      - name: Checkov (fails on any finding without a documented exception in its template)
        run: checkov -d infra --framework cloudformation --compact --quiet
      - name: Gitleaks (secrets anywhere in the git history)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  images:
    name: Container images build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t civictax-backend:ci backend
      - run: docker build -t civictax-frontend:ci frontend

  deploy:
    name: Deploy to AWS (production)
    needs: [backend, frontend, security, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production # protected in the repository settings: a reviewer approves every deployment
      url: ${{ steps.site.outputs.url }}
    permissions:
      contents: read
      id-token: write # OIDC: GitHub proves who it is to AWS; no AWS keys are stored in GitHub
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      PROJECT: civictax
      TAG: ${{ github.sha }} # one image per commit; the registry refuses to overwrite a tag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push the backend image (ARM64 for Graviton tasks)
        run: |
          if aws ecr describe-images --repository-name "$PROJECT-backend" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Image $TAG already pushed (re-run of this commit)"
          else
            docker buildx build --platform linux/arm64 --push -t "${{ steps.ecr.outputs.registry }}/$PROJECT-backend:$TAG" backend
          fi

      - name: Roll out the new image (only the image changes; infrastructure changes are deployed by a person)
        run: |
          args=()
          for key in $(aws cloudformation describe-stacks --stack-name "$PROJECT-app" --query 'Stacks[0].Parameters[].ParameterKey' --output text); do
            if [ "$key" = ImageTag ]; then args+=("ParameterKey=ImageTag,ParameterValue=$TAG")
            else args+=("ParameterKey=$key,UsePreviousValue=true"); fi
          done
          if out=$(aws cloudformation update-stack --stack-name "$PROJECT-app" --use-previous-template \
              --capabilities CAPABILITY_IAM --parameters "${args[@]}" 2>&1); then
            aws cloudformation wait stack-update-complete --stack-name "$PROJECT-app" # fails if ECS rolls back
          elif grep -q "No updates are to be performed" <<<"$out"; then
            echo "Already running $TAG"
          else
            echo "$out"; exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and publish the frontend
        id: site
        working-directory: frontend
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$PROJECT-$1" --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text; }
          npm ci
          VITE_COGNITO_DOMAIN=$(out auth HostedUiUrl) VITE_COGNITO_CLIENT_ID=$(out auth WebClientId) npm run build
          bucket=$(out edge FrontendBucketName)
          aws s3 sync dist "s3://$bucket" --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$bucket/index.html" --cache-control no-cache
          aws cloudfront create-invalidation --distribution-id "$(out edge DistributionId)" --paths /index.html
          echo "url=$(out edge AppUrl)" >> "$GITHUB_OUTPUT"
