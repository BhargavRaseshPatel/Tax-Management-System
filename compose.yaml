# Local stack. Values come from .env (copy .env.example).
#   Everything:      docker compose up -d --build --wait     → http://localhost:8088
#   Dev services:    docker compose up -d --wait postgres s3 dynamodb   (for ./mvnw spring-boot:run + npm run dev)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432" # host access for local tools and the non-Docker backend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Local stand-in for Amazon S3 (no AWS account needed). Creates the bucket at startup. Objects live in the
  # container and are lost on `docker compose down`; the backend then simply regenerates documents on demand.
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${DOCUMENTS_BUCKET:-civictax-documents}
    ports:
      - "127.0.0.1:${S3_PORT:-9090}:9090" # host access for the non-Docker backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/ >/dev/null || exit 1"]
      interval: 5s
      retries: 10

  # Amazon's own DynamoDB emulator for the report_jobs table. In-memory: the backend recreates the table on startup,
  # so restart the backend after restarting this container.
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "127.0.0.1:${DYNAMODB_PORT:-8000}:8000" # host access for the non-Docker backend
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8000/ || exit 1"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432" # container network port, not the host mapping above
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL_PARAMS: "" # local container has no TLS; Aurora uses verify-full (see docs/deployment.md)
      DEV_AUTH: ${DEV_AUTH:-false} # local token issuer; this stack is for local use only
      S3_ENDPOINT: http://s3:9090 # the emulator above; unset in AWS so the SDK talks to real S3
      DOCUMENTS_BUCKET: ${DOCUMENTS_BUCKET:-civictax-documents}
      DYNAMODB_ENDPOINT: http://dynamodb:8000 # the emulator above; unset in AWS
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
    # Not published: reachable only through the web container's /api proxy.

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
