# Local stack. Values come from .env (copy .env.example).
#   Everything:      docker compose up -d --build --wait     → http://localhost:8088
#   Dev services:    docker compose up -d --wait postgres s3 dynamodb stepfunctions
#                    (then ./mvnw spring-boot:run + npm run dev; the dev backend is also the report worker)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432" # host access for local tools and the non-Docker backend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Local stand-in for Amazon S3 (no AWS account needed). Creates the bucket at startup. Objects live in the
  # container and are lost on `docker compose down`; the backend then simply regenerates documents on demand.
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${DOCUMENTS_BUCKET:-civictax-documents}
    ports:
      - "127.0.0.1:${S3_PORT:-9090}:9090" # host access for the non-Docker backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/ >/dev/null || exit 1"]
      interval: 5s
      retries: 10

  # Amazon's own DynamoDB emulator for the report_jobs table. In-memory: the backend recreates the table on startup,
  # so restart the backend after restarting this container.
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "127.0.0.1:${DYNAMODB_PORT:-8000}:8000" # host access for the non-Docker backend
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8000/ || exit 1"]
      interval: 5s
      retries: 10

  # Amazon's Step Functions emulator. Its "mark job FAILED" step writes to the DynamoDB emulator above.
  # In-memory: the backend and worker recreate the state machine on startup.
  stepfunctions:
    image: amazon/aws-stepfunctions-local:2.0.0
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_DEFAULT_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: local # emulator placeholders, not real credentials
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "127.0.0.1:${STEP_FUNCTIONS_PORT:-8083}:8083" # host access for the non-Docker backend
    depends_on:
      dynamodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8083/ || exit 1"]
      interval: 5s
      retries: 10

  # The API. Not published: reachable only through the web container's /api proxy.
  backend: &app
    build: ./backend
    environment: &app-env
      DB_HOST: postgres
      DB_PORT: "5432" # container network port, not the host mapping above
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DEV_AUTH: ${DEV_AUTH:-false} # local token issuer; this stack is for local use only
      # Emulators above. All four are unset in AWS, so the SDK talks to the real services.
      S3_ENDPOINT: http://s3:9090
      DOCUMENTS_BUCKET: ${DOCUMENTS_BUCKET:-civictax-documents}
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      STEP_FUNCTIONS_ENDPOINT: http://stepfunctions:8083
      REPORT_WORKER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
      stepfunctions:
        condition: service_healthy

  # The report worker: the same image as the API, with the worker switched on. A separate ECS service in AWS.
  worker:
    <<: *app
    environment:
      <<: *app-env
      REPORT_WORKER_ENABLED: "true"
    depends_on:
      backend:
        condition: service_healthy # the API runs the database migrations first

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
