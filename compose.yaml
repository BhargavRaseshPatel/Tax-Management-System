# Local stack. Values come from .env (copy .env.example).
#   Everything:      docker compose up -d --build --wait     → http://localhost:8088
#   Database only:   docker compose up -d --wait postgres    (for ./mvnw spring-boot:run + npm run dev)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432" # host access for local tools and the non-Docker backend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432" # container network port, not the host mapping above
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL_PARAMS: "" # local container has no TLS; Aurora uses verify-full (see docs/deployment.md)
      DEV_AUTH: ${DEV_AUTH:-false} # local token issuer; this stack is for local use only
    depends_on:
      postgres:
        condition: service_healthy
    # Not published: reachable only through the web container's /api proxy.

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
