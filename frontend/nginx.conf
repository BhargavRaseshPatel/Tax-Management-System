# Serves the built SPA and forwards API calls to the backend container, so the browser sees one origin
# (same as the Vite dev proxy). The backend itself is not published to the host.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  # Inherited by every location below (none of them use add_header, which would reset the list).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # MUI/Emotion injects <style> tags at runtime, hence 'unsafe-inline' for styles only. Fonts come from Google Fonts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

  location ~ ^/(api|actuator|v3/api-docs|swagger-ui) {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed bundles never change.
  location /assets/ {
    expires 1y;
  }

  # Client-side routes (/resident, /officer/...) all load the SPA; index.html is always revalidated.
  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
